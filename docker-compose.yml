services:
  training-postgres:
    container_name: training-postgres
    image: postgres:latest
    environment:
      - POSTGRES_DB=employees
      - POSTGRES_USER=employees
      - POSTGRES_PASSWORD=employees
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgress/data:/var/lib/postgresql

  training-mongodb:
    container_name: training-mongodb
    image: mongo:latest
    environment:
      - MONGO_INITDB_DATABASE=employees
    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongodb/data:/data/db

  training-redis:
    container_name: training-redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data

  training-kafka:
    container_name: training-kafka
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - 9092:9092
    volumes:
      - ./docker/kafka/data:/var/lib/kafka/data

  training-ollama:
    # for nvidia, amd and cpu version, please read this: https://hub.docker.com/r/ollama/ollama
    container_name: training-ollama
    image: ollama/ollama:rocm
#    devices:
#      - /dev/kfd
#      - /dev/dri
#    group_add:
#      - video
#      - render
#      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ./docker/ollama:/root/.ollama

  training-ollama-intel:
    image: ollama/ollama:latest
    container_name: training-ollama-intel
    devices:
      - /dev/dri:/dev/dri  # Intel GPU
    volumes:
      - ./docker/ollama:/root/.ollama
    ports:
      - "11434:11434"
